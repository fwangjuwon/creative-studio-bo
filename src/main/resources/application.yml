spring:
  application:
    name: ns-creative-studio-bo
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    # JDK 내부
    jdk.internal.httpclient.debug: INFO
    # DB / 커넥션 풀
    org.postgresql.Driver: INFO
    org.postgresql.jdbc.PgConnection: INFO
    org.postgresql.core.v3.ConnectionFactoryImpl: INFO
    com.zaxxer.hikari.pool.HikariPool: INFO
    com.zaxxer.hikari.pool.PoolBase: INFO
    # Tomcat HTTP 커넥터 내부 (요청 파싱, 커넥션 처리 등)
    org.apache.coyote.http11: INFO
    # MyBatis 프레임워크 내부
    org.mybatis.spring.SqlSessionUtils: INFO

mybatis:
  config-location: classpath:mybatis-config.xml
  mapper-locations: classpath:mybatis/mappers/**/*.xml
  type-aliases-package: com.nsmall.ns_creative_studio_bo.domain

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-3-flash-preview
  image-model: gemini-3-pro-image-preview
  base-url: https://generativelanguage.googleapis.com/v1beta

image:
  storage-path: ./generated-images
  base-url: http://localhost:8080

cors:
  allowed-origins:
    - http://localhost:3000

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600