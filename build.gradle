plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.11'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.nsmall'
version = '0.0.1-SNAPSHOT'
description = 'Generative AI-Based Image Generation Backend'

ext {
    lombokVersion = '1.18.42'
    junitPlatformVersion = '1.12.2'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
    // Web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // MyBatis
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'

    // PostgreSQL
    runtimeOnly 'org.postgresql:postgresql'

    // Lombok
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // BCryptPasswordEncoder (Security 없이 crypto 모듈만 사용 — Step 4에서 Security 전환 예정)
    implementation 'org.springframework.security:spring-security-crypto'

    // Swagger (springdoc-openapi)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.14'
    implementation 'org.apache.commons:commons-lang3:3.20.0'    // CVE-2025-48924 취약점 대응 (springdoc 전이 의존성 버전 고정)

    // Gemini API — Spring RestClient 사용 (별도 SDK 없음, spring-boot-starter-web 포함)

    // Spring Security + JWT (Step 4)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.5'
    testImplementation "org.junit.platform:junit-platform-suite-api:${junitPlatformVersion}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junitPlatformVersion}"
    testRuntimeOnly "org.junit.platform:junit-platform-suite-engine:${junitPlatformVersion}"
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('bootRun') {
    // .env 파일을 bootRun JVM 환경변수로 주입 (파일 없으면 스킵)
    def envFile = file('.env')
    if (envFile.exists()) {
        envFile.readLines().each { line ->
            def trimmed = line.trim()
            if (trimmed && !trimmed.startsWith('#')) {
                def idx = trimmed.indexOf('=')
                if (idx > 0) {
                    def key = trimmed.substring(0, idx).trim()
                    def value = trimmed.substring(idx + 1).trim()
                    environment key, value
                }
            }
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()

    // .env 파일을 테스트 JVM 환경변수로 주입 (파일 없으면 스킵)
    def envFile = file('.env')
    if (envFile.exists()) {
        envFile.readLines().each { line ->
            def trimmed = line.trim()
            if (trimmed && !trimmed.startsWith('#')) {
                def idx = trimmed.indexOf('=')
                if (idx > 0) {
                    def key = trimmed.substring(0, idx).trim()
                    def value = trimmed.substring(idx + 1).trim()
                    environment key, value
                }
            }
        }
    }
}
