plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.11'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.nsmall'
version = '0.0.1-SNAPSHOT'
description = 'Generative AI-Based Image Generation Backend'

ext {
    lombokVersion = '1.18.42'
    junitPlatformVersion = '1.12.2'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
    // Web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // MyBatis
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'

    // PostgreSQL
    runtimeOnly 'org.postgresql:postgresql'

    // Lombok
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Gemini API — Spring RestClient 사용 (별도 SDK 없음, spring-boot-starter-web 포함)

    // Step 4에서 추가 예정
//  implementation 'org.springframework.boot:spring-boot-starter-security'
//  implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
//  runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
//  runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.5'
    testImplementation "org.junit.platform:junit-platform-suite-api:${junitPlatformVersion}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junitPlatformVersion}"
    testRuntimeOnly "org.junit.platform:junit-platform-suite-engine:${junitPlatformVersion}"

    // Step 4에서 추가 예정
//  testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
	useJUnitPlatform()
}
