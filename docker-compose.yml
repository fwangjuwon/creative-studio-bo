version: '3.8'
services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: prmpt-pgsql
    container_name: prmpt-pgsql-pod
    env_file:
      - .env
    ports:
      - 5432:5432
    networks:
      - prmpt-network
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./db/data.sql:/docker-entrypoint-initdb.d/2_data.sql
      - prmpt_postgres_volume:/var/lib/postgresql/data

networks:
  prmpt-network:
    driver: bridge
    name: prmpt_pod_networks

volumes:
  prmpt_postgres_volume:
    name: prmpt_postgres_volume
    driver: local